# DM-Arm White Config
#
# 目录
# 01 model            URDF 与模型基础信息
# 02 calibration      单机方向、比例与零位
# 03 control          运行时与基础控制增益
# 04 safety_policy    运行安全策略与收窄值
# 05 shutdown         停放与正常关机策略
# 06 capability       可选高级能力

# 01 model
model:
  urdf_path: ../../model/white/urdf/dm_arm.urdf                     # 有夹爪 URDF，路径相对当前 YAML
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]               # 受控关节名称与固定顺序
  base_frame: base_link                                                       # 动力学基坐标系
  tool_frame: tool0                                                           # 动力学末端坐标系
  gravity: [0.0, 0.0, -9.81]                                                  # 世界坐标系重力加速度 m/s^2\
  # 各关节重力补偿比例；1.0 表示使用完整模型重力
  gravity_scale: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}

# 02 calibration
calibration:
  joints:
    # 方向、位置比例、力矩比例、关节零位、执行器零位
    joint1: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0} 
    joint2: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint3: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint4: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint5: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint6: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}

# 03 control
control:
  runtime:
    ctrl_frequency_hz: 200.0                            # Robot::cycle() 目标控制频率 Hz
    joint_acc_filter_alpha: 0.2                         # 关节加速度一阶低通滤波系数；越小越平滑，越大越跟随实时变化
    write_enabled: false                                 # 是否允许向真实执行器写入控制命令；White 真机确认前保持 false
    model_feedforward_mode: GRAVITY                     # 模型前馈模式：NONE / GRAVITY / FULL_INVERSE_DYNAMICS
    tracking_impedance_mode: COMPLIANT_TRACKING         # 跟踪模式默认阻抗：RIGID_TRACKING / COMPLIANT_TRACKING
  controller:
    allow_full_cmd: false                               # 是否允许外部发送完整 MIT 风格 JointCtrlCmd
    # 刚性保持：较高 kp/kd，使关节稳定保持切换模式时的位置
    rigid_hold:
      kp: {joint1: 80.0, joint2: 200.0, joint3: 120.0, joint4: 50.0, joint5: 30.0, joint6: 10.0}  # 各关节位置刚度
      kd: {joint1: 0.8, joint2: 2.0, joint3: 1.2, joint4: 0.5, joint5: 0.3, joint6: 0.1}          # 各关节速度阻尼
    # 刚性跟踪：较高 kp/kd，使关节严格跟踪外部位置/速度参考
    rigid_tracking:
      kp: {joint1: 80.0, joint2: 200.0, joint3: 120.0, joint4: 50.0, joint5: 30.0, joint6: 10.0}  # 各关节位置刚度
      kd: {joint1: 0.8, joint2: 2.0, joint3: 1.2, joint4: 0.5, joint5: 0.3, joint6: 0.1}          # 各关节速度阻尼
    # 柔性保持：降低 kp/kd，使机械臂仅依靠较软的 PD 保持当前位置
    compliant_hold:
      kp: {joint1: 8.0, joint2: 20.0, joint3: 12.0, joint4: 5.0, joint5: 3.0, joint6: 1.0}       # 各关节低位置刚度
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.12, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节低速度阻尼
    # 柔性拖拽：kp=0，不主动拉回原位，仅使用 kd 抑制过快运动
    compliant_drag:
      kp: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}         # 位置恢复刚度；0 表示不主动回原位
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.12, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节拖拽阻尼
    # 柔性跟踪：较低 kp/kd，在跟踪外部参考时允许更明显的机械柔顺
    compliant_tracking:
      kp: {joint1: 8.0, joint2: 20.0, joint3: 12.0, joint4: 5.0, joint5: 3.0, joint6: 1.0}       # 各关节跟踪位置刚度
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.12, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节跟踪速度阻尼

# 04 safety_policy
safety_policy:
  position_margin: 0.0                              # 命令位置距离 URDF 硬限位的额外边距 rad
  cmd_vel_scale: 1.0                                # 命令速度相对 URDF velocity 上限的缩放比例
  state_vel_scale: 1.0                              # 状态速度检查相对 URDF velocity 上限的缩放比例
  # 各关节最大允许加速度 rad/s^2
  max_acc: {joint1: 10.8, joint2: 10.8, joint3: 10.8, joint4: 10.8, joint5: 10.8, joint6: 10.8}
  # kp 安全上限
  max_kp_override: {joint1: 100.0, joint2: 220.0, joint3: 140.0, joint4: 70.0, joint5: 50.0, joint6: 30.0}
  # kd 安全上限
  max_kd_override: {joint1: 1.0, joint2: 2.2, joint3: 1.4, joint4: 0.7, joint5: 0.5, joint6: 0.3}
  max_dt_s: 0.02                                    # Safety 接受的最大控制周期 s
  state_timeout_s: 0.05                             # 两帧合法硬件状态之间允许的最大间隔 s
  cmd_timeout_s: 0.10                               # 跟踪模式收到外部命令后的最大命令超时时间 s
  require_all_actuators_online: true                # 是否要求所有执行器在线
  require_all_actuators_enabled: true               # 是否要求所有执行器处于使能状态
  reject_motor_error: true                          # 是否在执行器返回错误码时进入安全处理
  require_continuous_cmd: false                     # 是否强制相邻外部命令连续；false 允许离散输入
  fault_recovery:
    default_mode: rigid_hold                        # FAULT 默认保持模式；当前固定为 rigid_hold
    allow_compliant_recovery: true                  # 是否允许操作员请求受限柔性恢复
    require_operator_request: true                  # 是否要求操作员显式请求柔性恢复
    gravity_model_validated: true                   # 是否确认重力模型已验证，可用于低增益恢复
    recovery_timeout_s: 30.0                        # 柔性恢复最大持续时间 s
    compliant_recovery:
      # 柔性恢复位置刚度
      kp: {joint1: 8.0, joint2: 20.0, joint3: 12.0, joint4: 5.0, joint5: 3.0, joint6: 1.0}
      # 柔性恢复速度阻尼
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.12, joint4: 0.05, joint5: 0.03, joint6: 0.01}
      # 柔性恢复最大关节速度 rad/s
      max_vel: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}
      effort_scale: 1.0                             # 柔性恢复重力补偿力矩缩放 [0, 1]

# 05 shutdown
shutdown:
  park_before_disable: true                         # 正常停机前是否先回到停放姿态
  # 各关节停放目标位置 rad
  park_pos: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}
  speed_scale: 0.10                                 # 停放轨迹速度相对正常速度的比例
  position_tolerance: 0.05                          # 严格停放位置误差阈值 rad
  velocity_tolerance: 0.05                          # 严格停放速度阈值 rad/s
  settle_time_s: 0.25                               # 严格判据下持续稳定时间 s
  relaxed_tolerance_ratio: 2.0                      # 超时前宽松判据相对严格阈值的倍率
  timeout_s: 15.0                                   # 停放流程最大允许时间 s

# 06 capability
capability:
  admittance:
    # 导纳能力总开关，false 时整条导纳链旁路
    enabled: true
    # 指定每个关节是否参与导纳位置退让
    joint_enabled: {joint1: true, joint2: true, joint3: true, joint4: true, joint5: true, joint6: true}

    observer:
      # MOMENTUM 不显式使用 qdd，FULL_ID 直接使用完整逆动力学 residual
      mode: FULL_ID
      # MOMENTUM observer 收敛增益 rad/s，FULL_ID 下保留但不参与计算
      momentum_gain: {joint1: 25.0, joint2: 25.0, joint3: 25.0, joint4: 25.0, joint5: 25.0, joint6: 25.0}
      # residual 一阶低通系数，越大越接近当前采样值
      filter_alpha: 0.10

    calibration:
      # 无外力时 observer residual 固定零偏 Nm，由静态标定生成
      torque_bias: {joint1: 0.037, joint2: 0.116, joint3: 1.857, joint4: 0.428, joint5: 0.017, joint6: 0.007}
      # bias 与动态摩擦补偿后的连续死区 Nm，由静态标定生成
      torque_threshold: {joint1: 0.03, joint2: 0.02, joint3: 0.03, joint4: 0.02, joint5: 0.01, joint6: 0.01}
      friction:
        # 是否使用双向 Coulomb + viscous 动态摩擦 residual 模型
        enabled: false
        # 仅当 |dq| 达到该速度后使用动态摩擦模型 rad/s
        velocity_transition: 0.03
        # dq>0 时的 signed Coulomb residual Nm，由摩擦标定生成
        positive_coulomb: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}
        # dq>0 时的 signed viscous residual 斜率 Nm/(rad/s)，由摩擦标定生成
        positive_viscous: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}
        # dq<0 时的 signed Coulomb residual Nm，由摩擦标定生成
        negative_coulomb: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}
        # dq<0 时的 signed viscous residual 斜率 Nm/(rad/s)，由摩擦标定生成
        negative_viscous: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}

    controller:
      # 虚拟质量 M，越大启动越缓和
      mass: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}
      # 虚拟阻尼 D，越大运动越稳但手感越黏
      damping: {joint1: 6.0, joint2: 6.0, joint3: 6.0, joint4: 6.0, joint5: 6.0, joint6: 6.0}
      # 虚拟刚度 K，越大松手回到 nominal q 的能力越强
      stiffness: {joint1: 20.0, joint2: 20.0, joint3: 20.0, joint4: 20.0, joint5: 20.0, joint6: 20.0}
      # 最大导纳位置修正绝对值 rad
      max_delta_q: {joint1: 0.10, joint2: 0.10, joint3: 0.10, joint4: 0.10, joint5: 0.10, joint6: 0.10}
      # 最大导纳速度修正绝对值 rad/s
      max_delta_q_dot: {joint1: 0.30, joint2: 0.30, joint3: 0.30, joint4: 0.30, joint5: 0.30, joint6: 0.30}
