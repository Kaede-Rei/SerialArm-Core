# DM-Arm Gray Config
#
# 目录
# 01 model            URDF 与模型基础信息
# 02 calibration      单机方向、比例与零位
# 03 control          运行时与基础控制增益
# 04 safety_policy    运行安全策略与收窄值
# 05 shutdown         停放与正常关机策略
# 06 capability       可选高级能力

# 01 model
model:
  urdf_path: ../../model/gray/urdf/dm_arm_no_gripper.urdf                     # 无夹爪 URDF，路径相对当前 YAML
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]               # 受控关节名称与固定顺序
  base_frame: base_link                                                       # 动力学基坐标系
  tool_frame: tool0                                                           # 动力学末端坐标系
  gravity: [0.0, 0.0, -9.81]                                                  # 世界坐标系重力加速度 m/s^2\
  # 各关节重力补偿比例；1.0 表示使用完整模型重力
  gravity_scale: {joint1: 1.000000, joint2: 1.000000, joint3: 1.000000, joint4: 0.994403, joint5: 0.994043, joint6: 1.000000}

# 02 calibration
calibration:
  joints:
    # 方向、位置比例、力矩比例、关节零位、执行器零位
    joint1: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0} 
    joint2: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint3: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint4: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint5: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}
    joint6: {direction: 1.0, pos_ratio: 1.0, tor_ratio: 1.0, joint_zero_offset: 0.0, actuator_zero_offset: 0.0}

# 03 control
control:
  runtime:
    ctrl_frequency_hz: 200.0                            # Robot::cycle() 目标控制频率 Hz
    joint_acc_filter_alpha: 0.2                         # 关节加速度一阶低通滤波系数；越小越平滑，越大越跟随实时变化
    write_enabled: true                                 # 是否允许向真实执行器写入控制命令
    model_feedforward_mode: GRAVITY                     # 模型前馈模式：NONE / GRAVITY / FULL_INVERSE_DYNAMICS
    tracking_impedance_mode: COMPLIANT_TRACKING         # 跟踪模式默认阻抗：RIGID_TRACKING / COMPLIANT_TRACKING
  controller:
    allow_full_cmd: false                               # 是否允许外部发送完整 MIT 风格 JointCtrlCmd
    # 刚性保持：较高 kp/kd，使关节稳定保持切换模式时的位置
    rigid_hold:
      kp: {joint1: 80.0, joint2: 200.0, joint3: 200.0, joint4: 50.0, joint5: 30.0, joint6: 10.0}  # 各关节位置刚度
      kd: {joint1: 1.6, joint2: 4.0, joint3: 4.0, joint4: 1.0, joint5: 0.6, joint6: 0.2}          # 各关节速度阻尼
    # 刚性跟踪：较高 kp/kd，使关节严格跟踪外部位置/速度参考
    rigid_tracking:
      kp: {joint1: 80.0, joint2: 200.0, joint3: 200.0, joint4: 50.0, joint5: 30.0, joint6: 10.0}  # 各关节位置刚度
      kd: {joint1: 1.6, joint2: 4.0, joint3: 4.0, joint4: 1.0, joint5: 0.6, joint6: 0.2}          # 各关节速度阻尼
    # 柔性保持：降低 kp/kd，使机械臂仅依靠较软的 PD 保持当前位置
    compliant_hold:
      kp: {joint1: 4.0, joint2: 10.0, joint3: 10.0, joint4: 2.5, joint5: 1.5, joint6: 0.5}       # 各关节低位置刚度
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.20, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节低速度阻尼
    # 柔性拖拽：kp=0，不主动拉回原位，仅使用 kd 抑制过快运动
    compliant_drag:
      kp: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}         # 位置恢复刚度；0 表示不主动回原位
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.20, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节拖拽阻尼
    # 柔性跟踪：较低 kp/kd，在跟踪外部参考时允许更明显的机械柔顺
    compliant_tracking:
      kp: {joint1: 4.0, joint2: 10.0, joint3: 10.0, joint4: 2.5, joint5: 1.5, joint6: 0.5}       # 各关节跟踪位置刚度
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.20, joint4: 0.05, joint5: 0.03, joint6: 0.01}   # 各关节跟踪速度阻尼

# 04 safety_policy
safety_policy:
  position_margin: 0.0                              # 命令位置距离 URDF 硬限位的额外边距 rad
  cmd_vel_scale: 1.0                                # 命令速度相对 URDF velocity 上限的缩放比例
  state_vel_scale: 1.0                              # 状态速度检查相对 URDF velocity 上限的缩放比例
  # 各关节最大允许加速度 rad/s^2
  max_acc: {joint1: 10.8, joint2: 10.8, joint3: 10.8, joint4: 10.8, joint5: 10.8, joint6: 10.8}
  # kp 安全上限
  max_kp_override: {joint1: 100.0, joint2: 220.0, joint3: 220.0, joint4: 70.0, joint5: 50.0, joint6: 30.0}
  # kd 安全上限
  max_kd_override: {joint1: 1.8, joint2: 4.2, joint3: 4.2, joint4: 1.2, joint5: 0.8, joint6: 0.4}
  max_dt_s: 0.02                                    # Safety 接受的最大控制周期 s
  state_timeout_s: 0.05                             # 两帧合法硬件状态之间允许的最大间隔 s
  cmd_timeout_s: 0.10                               # 跟踪模式收到外部命令后的最大命令超时时间 s
  require_all_actuators_online: true                # 是否要求所有执行器在线
  require_all_actuators_enabled: true               # 是否要求所有执行器处于使能状态
  reject_motor_error: true                          # 是否在执行器返回错误码时进入安全处理
  require_continuous_cmd: false                     # 是否强制相邻外部命令连续；false 允许离散输入
  fault_recovery:
    default_mode: rigid_hold                        # FAULT 默认保持模式；当前固定为 rigid_hold
    allow_compliant_recovery: true                  # 是否允许操作员请求受限柔性恢复
    require_operator_request: true                  # 是否要求操作员显式请求柔性恢复
    gravity_model_validated: true                   # 是否确认重力模型已验证，可用于低增益恢复
    recovery_timeout_s: 30.0                        # 柔性恢复最大持续时间 s
    compliant_recovery:
      # 柔性恢复位置刚度
      kp: {joint1: 8.0, joint2: 20.0, joint3: 20.0, joint4: 5.0, joint5: 3.0, joint6: 1.0}
      # 柔性恢复速度阻尼
      kd: {joint1: 0.08, joint2: 0.20, joint3: 0.20, joint4: 0.05, joint5: 0.03, joint6: 0.01}
      # 柔性恢复最大关节速度 rad/s
      max_vel: {joint1: 5.4, joint2: 5.4, joint3: 5.4, joint4: 5.4, joint5: 5.4, joint6: 5.4}
      effort_scale: 1.0                             # 柔性恢复重力补偿力矩缩放 [0, 1]

# 05 shutdown
shutdown:
  park_before_disable: true                         # 正常停机前是否先回到停放姿态
  # 各关节停放目标位置 rad
  park_pos: {joint1: 0.0, joint2: 0.0, joint3: 0.0, joint4: 0.0, joint5: 0.0, joint6: 0.0}
  speed_scale: 0.10                                 # 停放轨迹速度相对正常速度的比例
  position_tolerance: 0.05                          # 严格停放位置误差阈值 rad
  velocity_tolerance: 0.05                          # 严格停放速度阈值 rad/s
  settle_time_s: 0.25                               # 严格判据下持续稳定时间 s
  relaxed_tolerance_ratio: 2.0                      # 超时前宽松判据相对严格阈值的倍率
  timeout_s: 15.0                                   # 停放流程最大允许时间 s

# 06 capability
capability:
  # 导纳控制能力配置
  admittance:
    enabled: true                                   # 能力总开关；false 时整条导纳链完全旁路
    joint_enabled: {joint1: true, joint2: true, joint3: true, joint4: true, joint5: true, joint6: true}
    # 外力估计：正式使用 MOMENTUM；FULL_ID 仅保留诊断/兼容
    observer:
      mode: MOMENTUM
      momentum_gain: {joint1: 25.0, joint2: 25.0, joint3: 25.0, joint4: 25.0, joint5: 25.0, joint6: 25.0}
      filter_alpha: 0.95                            # residual 一阶低通系数，越大响应越快
    # 本机导纳标定结果：静态 residual + 速度相关摩擦
    calibration:
      torque_bias: {joint1: 0.034187, joint2: 0.047860, joint3: 0.043822, joint4: 0.017832, joint5: 0.012495, joint6: 0.007863}
      torque_threshold: {joint1: 0.054701, joint2: 0.079284, joint3: 0.067435, joint4: 0.023650, joint5: 0.016142, joint6: 0.011323}
      friction:
        enabled: false                              # 是否启用摩擦补偿；false 时整条摩擦链完全旁路
        velocity_transition: 0.03                   # rad/s；高于该速度认为运动方向可靠
        zero_velocity_adaptation_s: 0.60            # s；零速静摩擦 baseline 自适应时间
        kinetic_feedforward_scale: 0.0              # [0,0.7]；滑动摩擦主动助力，默认关闭
        positive_coulomb: {joint1: -0.455411, joint2: -0.595958, joint3: -1.069792, joint4: -0.178879, joint5: -0.240333, joint6: -0.098355}
        positive_viscous: {joint1: -0.410761, joint2: -1.334751, joint3: 0.093685, joint4: 0.207873, joint5: 0.104405, joint6: 0.022306}
        negative_coulomb: {joint1: 0.412010, joint2: 0.264695, joint3: 1.462916, joint4: 0.232794, joint5: 0.093390, joint6: 0.181499}
        negative_viscous: {joint1: 0.409533, joint2: 0.122555, joint3: -0.161903, joint4: -0.000483, joint5: 0.000436, joint6: -0.007653}
    # 用户手感目标；M/D/K 由 Core 运行时派生，不在 YAML 中直接配置
    # 派生关系：
    #   D = comfortable_torque / follow_speed
    #   M = D * start_response_s / 3
    #   K = M * (4.74 / return_time_s)^2
    feel:
      # Nm；舒适推力矩，表示用户可舒适持续施加的外力矩目标；该值越大，同样速度下派生阻尼 D 越大，推动会更“沉”
      comfortable_torque: {joint1: 1.8, joint2: 1.8, joint3: 1.8, joint4: 1.8, joint5: 1.8, joint6: 1.8}
      # rad/s；舒适推力矩对应的期望跟随速度；该值越大，同样推力矩下派生阻尼 D 越小，手感会更“轻”
      follow_speed: {joint1: 0.5, joint2: 0.5, joint3: 0.5, joint4: 0.5, joint5: 0.5, joint6: 0.5}
      # s；从开始受力到达到约 95% 跟随速度的目标响应时间；该值越小，派生质量 M 越小，启动响应越快
      start_response_s: {joint1: 0.333333, joint2: 0.333333, joint3: 0.333333, joint4: 0.333333, joint5: 0.333333, joint6: 0.333333}
      # rad/s；导纳修正速度超过该值后开始增加阻尼，形成 Q 弹阻力；必须小于 max_correction_speed
      q_elastic_start_speed: {joint1: 0.70, joint2: 0.70, joint3: 0.70, joint4: 0.70, joint5: 0.70, joint6: 0.70}
      # s；松手后回到中位约 95% 位移的目标时间；该值越小，派生刚度 K 越大，回中越快
      return_time_s: {joint1: 1.059896, joint2: 1.059896, joint3: 1.059896, joint4: 1.059896, joint5: 1.059896, joint6: 1.059896}
      # rad；最大导纳位置偏移，限制允许退让/修正的角度幅度
      max_retreat: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}
      # rad/s；最大导纳修正速度，限制导纳输出变化速度；必须大于 q_elastic_start_speed
      max_correction_speed: {joint1: 1.0, joint2: 1.0, joint3: 1.0, joint4: 1.0, joint5: 1.0, joint6: 1.0}
      # 无量纲；Q 弹区最大阻尼倍率，>= 1；速度越接近上限，阻尼最高可增至 D 的该倍率
      q_elastic_max_resistance_ratio: 4.0
