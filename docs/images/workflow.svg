<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="632" viewBox="0 0 1320 632" role="img" aria-labelledby="title desc">
  <title id="title">机械臂接入与调试</title>
  <desc id="desc">先完成共同基础四项任务，再按 MIT 或 CSP 完成三项路径任务；六项可选提升分别记录，历史结果重启后保留</desc>
  <rect width="1320" height="632" rx="24" fill="#faf9f5"/>
  <g font-family="Maple Mono NF CN, Noto Sans CJK SC, sans-serif" fill="#2f312d">
    <text x="36" y="52" font-size="27" font-weight="600">机械臂接入与调试</text>
    <text x="36" y="85" font-size="16" fill="#74756e">核对模型与硬件，完成基础运动检查，再验证所选控制路径</text>
    <rect x="36" y="116" width="396" height="444" rx="16" fill="#fffefa" stroke="#e4e1d9"/>
    <rect x="56" y="137" width="32" height="32" rx="10" fill="#ff7b35"/>
    <text x="72" y="160" text-anchor="middle" font-size="17" fill="#fff">一</text>
    <text x="102" y="160" font-size="23" font-weight="600">共同基础</text>
    <g font-size="17" font-weight="600">
      <text x="58" y="215">模型与硬件连接</text>
      <text x="58" y="291">关节映射与安全边界</text>
      <text x="58" y="367">刚性保持与逐轴运动</text>
      <text x="58" y="443">停止与故障处理</text>
    </g>
    <g font-size="14" fill="#74756e">
      <text x="58" y="240">查看模型，连接并核对失能反馈</text>
      <text x="58" y="316">填写映射、运动边界和初始保持参数</text>
      <text x="58" y="392">受限正反运动，实测模型与真机对应</text>
      <text x="58" y="468">检查停止、失能与故障恢复条件</text>
    </g>
    <path d="M58 497H410" stroke="#e4e1d9"/>
    <text x="58" y="530" font-size="15" fill="#74756e">填写检查项并保存结果</text>
    <rect x="462" y="116" width="396" height="444" rx="16" fill="#fffefa" stroke="#e4e1d9"/>
    <rect x="482" y="137" width="32" height="32" rx="10" fill="#ff7b35"/>
    <text x="498" y="160" text-anchor="middle" font-size="17" fill="#fff">二</text>
    <text x="528" y="160" font-size="23" font-weight="600">路径专项</text>
    <text x="484" y="210" font-size="18" font-weight="600">阻抗 + MIT</text>
    <g font-size="16">
      <text x="484" y="243">1　重力补偿验证</text>
      <text x="484" y="275">2　增益与轨迹跟踪</text>
      <text x="484" y="307">3　拖拽、模式切换与上层接口</text>
    </g>
    <path d="M484 330H836" stroke="#e4e1d9"/>
    <text x="484" y="366" font-size="18" font-weight="600">导纳 + CSP</text>
    <g font-size="16">
      <text x="484" y="399">1　外力估计校准与验收</text>
      <text x="484" y="431">2　导纳退让与释放回位</text>
      <text x="484" y="463">3　拖拽、模式切换与上层接口</text>
    </g>
    <path d="M484 497H836" stroke="#e4e1d9"/>
    <text x="484" y="530" font-size="15" fill="#74756e">独立验证外力，完整记录退让与释放</text>
    <rect x="888" y="116" width="396" height="444" rx="16" fill="#fffefa" stroke="#e4e1d9"/>
    <rect x="908" y="137" width="32" height="32" rx="10" fill="#ff7b35"/>
    <text x="924" y="160" text-anchor="middle" font-size="17" fill="#fff">三</text>
    <text x="954" y="160" font-size="23" font-weight="600">可选提升</text>
    <g font-size="17">
      <text x="910" y="215">自动停放验收</text>
      <text x="910" y="263">重力模型校正</text>
      <text x="910" y="311">完整动力学辨识</text>
      <text x="910" y="359">TCP 与几何标定</text>
      <text x="910" y="407">重复到位与重复定位</text>
      <text x="910" y="455">绝对定位精度</text>
    </g>
    <path d="M910 497H1262" stroke="#e4e1d9"/>
    <text x="910" y="530" font-size="15" fill="#74756e">按任务采用，分别保存方法与结果</text>
    <text x="36" y="602" font-size="16" fill="#74756e">重启保留记录；相关参数变化后复查对应任务；本次连接状态单独显示</text>
  </g>
</svg>
